[project]
name = "pytobs"
version = "0.1.0"
description = "A quiet, fast Python editor for the terminal: write, run, fix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=8.2,<8.3",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "jedi>=0.19.2",
    "ruff>=0.6",
]

[project.scripts]
pytobs = "pytobs.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytobs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "ASYNC", "RUF100"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "install.ps1"]
